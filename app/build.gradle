plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lyko.autosign'
    compileSdk 37

    defaultConfig {
        applicationId 'com.lyko.autosign'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly project(':xposed-api-stubs')
}
